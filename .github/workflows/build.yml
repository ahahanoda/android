name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q PagedLauncher.zip

      - name: Install Android SDK packages
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 6.9.4
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-6.9.4-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        working-directory: PagedLauncher
        run: ../gradle-6.9.4/bin/gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PagedLauncher-apk
          path: PagedLauncher/app/build/outputs/apk/debug/app-debug.apk
